<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geofisiana - HMGF UGM</title>

    <!-- Import Font Roboto & Inter (Font Bold Sans-Serif) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400&display=swap" rel="stylesheet">

    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- PANGGIL CSS BACKGROUND ACAK -->
    <link rel="stylesheet" href="css/background.css">

    <!-- CSS Navbar, Footer, Utama & Khusus Geofisiana -->
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/geo-insight.css">
</head>
<body class="page-geofisiana">

    <!-- CONTAINER BACKGROUND ACAK -->
    <div id="dynamic-bg-container" aria-hidden="true"></div>

    <!-- Container Navbar (Fixed) -->
    <div id="navbar-placeholder"></div>

    <!-- Header Section -->
    <header class="geo-header-natural" style="position: relative; z-index: 1;">
        <div class="header-container">
            <h1 class="seg-title geofisiana-title" style="font-family: 'Inter', sans-serif !important; font-weight: 900 !important; letter-spacing: 0.06em !important;">GEOFISIANA</h1>
            <p class="seg-subtitle">Arsip artikel, wawasan, dan publikasi populer kebumian HMGF UGM</p>
        </div>
    </header>

    <!-- MAIN SECTION -->
    <main class="geo-main-grid" style="position: relative; z-index: 1;">
        <!-- Kolom Utama: Feed Berita -->
        <section>
            <div id="newsFeed">
                <!-- Skeleton Loader -->
                <div style="text-align: center; padding: 50px 20px; background: #ffffff; border-radius: 12px; border: 1px solid #e2e8f0; color: #64748b;">
                    <i class="fa-solid fa-spinner fa-spin fa-2x" style="color: #0f172a;"></i>
                    <p style="margin-top: 12px; font-weight: 500;">Memuat artikel Geofisiana...</p>
                </div>
            </div>

            <!-- Navigasi Halaman / Pagination Dinamis -->
            <div class="geo-pagination" id="paginationContainer" style="display: none;"></div>
        </section>

        <!-- Sidebar Kanan -->
        <aside>
            <!-- Widget Mesin Pencari Judul -->
            <div class="natural-widget">
                <div class="natural-widget-title">
                    <span>Cari Judul Artikel</span>
                </div>
                <div class="search-box-wrapper">
                    <input type="text" id="searchInput" class="search-input" placeholder="Ketik judul artikel..." onkeyup="handleSearchInput(event)">
                    <button id="searchBtn" class="search-icon-btn" onclick="clearSearchInput()">
                        <i id="searchIcon" class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </div>
            </div>

            <!-- Widget Kategori Lainnya -->
            <div class="natural-widget">
                <div class="natural-widget-title">
                    <span>Kategori lainnya</span>
                </div>
                <ul class="natural-cat-list">
                    <li><a href="seputar-hmgf.html">Seputar HMGF <i class="fa-solid fa-chevron-right" style="font-size: 0.7rem; opacity: 0.5;"></i></a></li>
                    <li><a href="seg-news.html">SEG News <i class="fa-solid fa-chevron-right" style="font-size: 0.7rem; opacity: 0.5;"></i></a></li>
                    <li><a href="metode-geofisika.html">Metode Geofisika <i class="fa-solid fa-chevron-right" style="font-size: 0.7rem; opacity: 0.5;"></i></a></li>
                    <li><a href="majalah-spektral.html">Majalah Spektral <i class="fa-solid fa-chevron-right" style="font-size: 0.7rem; opacity: 0.5;"></i></a></li>
                    <li><a href="geofisiana.html" class="active">Geofisiana <i class="fa-solid fa-chevron-right" style="font-size: 0.7rem; opacity: 0.5;"></i></a></li>
                    <li><a href="geolibrary.html">Geolibrary <i class="fa-solid fa-chevron-right" style="font-size: 0.7rem; opacity: 0.5;"></i></a></li>
                    <li><a href="penelitian.html">Penelitian <i class="fa-solid fa-chevron-right" style="font-size: 0.7rem; opacity: 0.5;"></i></a></li>
                </ul>
            </div>

            <!-- Widget Filter Tahun Arsip -->
            <div class="natural-widget">
                <div class="natural-widget-title">
                    <span>Tahun Arsip</span>
                </div>
                <div class="natural-year-grid" id="yearTagsContainer">
                    <span class="natural-year-tag active" onclick="filterByYear('ALL')">Semua Tahun</span>
                    <!-- Tahun dinamis dirender di sini -->
                </div>
            </div>
        </aside>
    </main>

    <!-- Container Footer -->
    <div id="footer-placeholder"></div>

    <!-- Script Navbar & Route Handler -->
    <script src="js/navbar.js"></script>

    <!-- Script Component Loader & Logika Data -->
    <script>
        // Memuat Navbar & Footer Secara Dinamis
        fetch('navbar.html')
            .then(response => response.text())
            .then(data => { 
                document.getElementById('navbar-placeholder').innerHTML = data; 
                highlightActiveMenu();
                if (typeof initNavbarScroll === 'function') {
                    initNavbarScroll();
                }
            })
            .catch(err => console.error('Gagal memuat navbar:', err));

        fetch('footer.html')
            .then(response => response.text())
            .then(data => { document.getElementById('footer-placeholder').innerHTML = data; })
            .catch(err => console.error('Gagal memuat footer:', err));

        function highlightActiveMenu() {
            const navbar = document.getElementById('navbar-placeholder');
            if (!navbar) return;

            navbar.querySelectorAll('.active').forEach(el => el.classList.remove('active'));

            const geofisianaLink = navbar.querySelector('a[href*="geofisiana.html"]');
            if (geofisianaLink) {
                geofisianaLink.classList.add('active');
                const parentNavItem = geofisianaLink.closest('.nav-item');
                if (parentNavItem) {
                    const parentLink = parentNavItem.querySelector('.nav-link');
                    if (parentLink) parentLink.classList.add('active');
                }
            }
        }

        // API Configuration & Multiple Sheet Names
        const BASE_STEIN_URL = "https://api.steinhq.com/v1/storages/6a7d6e3992b1163e972efed8";
        const SHEET_HMGF = "Seputar HMGF";
        const SHEET_SEG = "SEG News";

        const ITEMS_PER_PAGE = 5;
        let allGeofisianaArticles = [];
        let activeFilteredArticles = [];
        let selectedYear = 'ALL';
        let searchQuery = '';
        let currentPage = 1;

        /**
         * Normalisasi nama kolom spreadsheet agar selaras dengan insight.js
         */
        function normalizeArticleData(item) {
            if (!item) return null;
            return {
                id: String(item.id || item.Id || ''),
                judul: (item.judul || item['Judul Berita'] || item.Judul || '').trim(),
                gambar_hero: item.gambar_hero || item.gambar_drive || item['Gambar Link'] || item.Gambar || '',
                penulis: (item.penulis || item.Penulis || 'Redaksi HMGF').trim(),
                tanggal: item.tanggal || item.Tanggal || '-',
                kategori: item.kategori || item.Kategori || 'Geofisiana',
                isi_1: item.isi_1 || item['Isi 1'] || '',
                isi_2: item.isi_2 || item['Isi 2'] || '',
                isi_3: item.isi_3 || item['Isi 3'] || '',
                isi_4: item.isi_4 || item['Isi 4'] || '',
                isi_5: item.isi_5 || item['Isi 5'] || '',
                published: item.published ?? item.Published,
                link_berkas: item.link_berkas || item['Link Berita'] || item.link_berita || ''
            };
        }

        function isPublished(val) {
            if (typeof val === 'boolean') return val;
            if (typeof val === 'number') return val === 1;
            if (typeof val === 'string') {
                const lower = val.trim().toLowerCase();
                return lower === 'true' || lower === '1';
            }
            return false;
        }

        function formatDriveUrl(rawUrl) {
            if (!rawUrl || typeof rawUrl !== 'string' || rawUrl.includes('#REF!')) return 'assets/SEG_News/pantai.png';
            let cleanUrl = rawUrl.split('|')[0].trim();
            const match = cleanUrl.match(/(?:file\/d\/|id=|lh3\.googleusercontent\.com\/d\/)([a-zA-Z0-9_-]+)/);
            if (match && match[1]) {
                return `https://lh3.googleusercontent.com/d/${match[1]}`;
            }
            return cleanUrl;
        }

        function extractYear(dateString) {
            if (!dateString) return null;
            const match = dateString.match(/\b(20\d{2}|19\d{2})\b/);
            return match ? match[0] : null;
        }

        /**
         * Fetch Data dari "Seputar HMGF" & "SEG News" secara bersamaan
         */
        async function loadGeofisianaArticles() {
            const feedContainer = document.getElementById('newsFeed');
            try {
                const [resHMGF, resSEG] = await Promise.all([
                    fetch(`${BASE_STEIN_URL}/${encodeURIComponent(SHEET_HMGF)}`).catch(() => null),
                    fetch(`${BASE_STEIN_URL}/${encodeURIComponent(SHEET_SEG)}`).catch(() => null)
                ]);

                const rawHMGF = resHMGF && resHMGF.ok ? await resHMGF.json() : [];
                const rawSEG = resSEG && resSEG.ok ? await resSEG.json() : [];

                const combinedData = [
                    ...(Array.isArray(rawHMGF) ? rawHMGF : []),
                    ...(Array.isArray(rawSEG) ? rawSEG : [])
                ].map(normalizeArticleData);

                // Filter 1: Kategori mengandung kata "geofisiana"
                // Filter 2: Published berstatus true
                const filtered = combinedData.filter(item => {
                    if (!item || !item.judul) return false;
                    const isGeofisianaCategory = item.kategori && item.kategori.toLowerCase().includes('geofisiana');
                    return isGeofisianaCategory && isPublished(item.published);
                });

                allGeofisianaArticles = filtered.map(article => ({
                    ...article,
                    extracted_year: extractYear(article.tanggal)
                }));

                renderYearTags();
                applyFilters();

            } catch (error) {
                console.error("Gagal memuat artikel Geofisiana:", error);
                feedContainer.innerHTML = `
                    <div style="text-align: center; padding: 40px 20px; background: #ffffff; border-radius: 12px; border: 1px solid #fee2e2; color: #ef4444;">
                        <i class="fa-solid fa-triangle-exclamation fa-2x"></i>
                        <p style="margin-top: 10px; font-weight: 500;">Gagal memuat artikel Geofisiana. Silakan coba beberapa saat lagi.</p>
                    </div>
                `;
            }
        }

        function handleSearchInput(event) {
            searchQuery = event.target.value.toLowerCase().trim();
            const iconEl = document.getElementById('searchIcon');
            const btnEl = document.getElementById('searchBtn');

            if (searchQuery.length > 0) {
                iconEl.className = "fa-solid fa-xmark";
                btnEl.classList.add("search-clear-btn");
                btnEl.classList.remove("search-icon-btn");
            } else {
                iconEl.className = "fa-solid fa-magnifying-glass";
                btnEl.classList.add("search-icon-btn");
                btnEl.classList.remove("search-clear-btn");
            }

            applyFilters();
        }

        function clearSearchInput() {
            const inputEl = document.getElementById('searchInput');
            if (inputEl.value !== '') {
                inputEl.value = '';
                searchQuery = '';
                handleSearchInput({ target: inputEl });
            }
        }

        function renderYearTags() {
            const container = document.getElementById('yearTagsContainer');
            if (!container) return;
            
            container.innerHTML = '<span class="natural-year-tag active" onclick="filterByYear(\'ALL\')">Semua Tahun</span>';
            const years = [...new Set(allGeofisianaArticles.map(a => a.extracted_year).filter(Boolean))].sort((a, b) => b - a);

            years.forEach(year => {
                const tag = document.createElement('span');
                tag.className = 'natural-year-tag';
                tag.innerText = year;
                tag.onclick = () => filterByYear(year);
                container.appendChild(tag);
            });
        }

        function filterByYear(year) {
            selectedYear = year;

            const tags = document.querySelectorAll('#yearTagsContainer .natural-year-tag');
            tags.forEach(tag => {
                const tagText = tag.innerText.trim();
                if (tagText === String(year) || (year === 'ALL' && tagText === 'Semua Tahun')) {
                    tag.classList.add('active');
                } else {
                    tag.classList.remove('active');
                }
            });

            applyFilters();
        }

        function applyFilters() {
            activeFilteredArticles = allGeofisianaArticles.filter(item => {
                const matchTitle = !searchQuery || (item.judul && item.judul.toLowerCase().includes(searchQuery));
                const matchYear = (selectedYear === 'ALL') || (item.extracted_year === String(selectedYear));
                return matchTitle && matchYear;
            });

            const feedContainer = document.getElementById('newsFeed');

            if (activeFilteredArticles.length === 0) {
                feedContainer.innerHTML = `
                    <div style="text-align: center; padding: 50px 20px; background: rgba(255,255,255,0.8); border-radius: 18px; border: 1px dashed #cbd5e1; color: #64748b;">
                        <i class="fa-solid fa-magnifying-glass" style="font-size: 2.2rem; margin-bottom: 12px; color: #0f172a;"></i>
                        <h3 style="font-size: 1.05rem; font-weight: 700; color: #0f172a; margin: 0;">Artikel Tidak Ditemukan</h3>
                        <p style="font-size: 0.88rem; margin-top: 4px;">Tidak ditemukan judul yang cocok dengan kata kunci "${searchQuery}"${selectedYear !== 'ALL' ? ` pada tahun ${selectedYear}` : ''}.</p>
                    </div>
                `;
                document.getElementById('paginationContainer').style.display = 'none';
                return;
            }

            renderPage(1);
            setupPagination();
        }

        function renderPage(pageNumber) {
            currentPage = pageNumber;
            const feedContainer = document.getElementById('newsFeed');
            feedContainer.innerHTML = '';

            const startIndex = (pageNumber - 1) * ITEMS_PER_PAGE;
            const endIndex = startIndex + ITEMS_PER_PAGE;
            const pageArticles = activeFilteredArticles.slice(startIndex, endIndex);

            pageArticles.forEach(item => {
                const encodedTitle = encodeURIComponent((item.judul || '').trim());
                const detailUrl = `berita-insight.html?judul=${encodedTitle}`;
                const imageSrc = formatDriveUrl(item.gambar_hero);

                feedContainer.innerHTML += `
                    <article class="news-item geo-card">
                        <h2 class="news-item-title">${item.judul || 'Tanpa Judul'}</h2>
                        <div class="news-meta">
                            <span><i class="fa-regular fa-calendar-days"></i> ${item.tanggal || '-'}</span>
                            <span class="news-meta-divider">•</span>
                            <span><i class="fa-solid fa-folder-open"></i> ${item.kategori || 'Geofisiana'}</span>
                        </div>
                        <div class="news-image-wrapper">
                            <img src="${imageSrc}" alt="${item.judul}" class="news-image" onerror="this.onerror=null;this.src='assets/SEG_News/pantai.png';">
                        </div>
                        <p class="news-excerpt">
                            ${item.isi_1 ? item.isi_1.substring(0, 190) + '...' : ''}
                        </p>
                        <div class="btn-selengkapnya-container">
                            <a href="${detailUrl}" class="btn-geo-natural">
                                Baca Selengkapnya <i class="fa-solid fa-arrow-right"></i>
                            </a>
                        </div>
                    </article>
                `;
            });

            window.scrollTo({ top: 180, behavior: 'smooth' });
        }

        function setupPagination() {
            const paginationContainer = document.getElementById('paginationContainer');
            paginationContainer.innerHTML = '';

            const totalPages = Math.ceil(activeFilteredArticles.length / ITEMS_PER_PAGE);

            if (totalPages <= 1) {
                paginationContainer.style.display = 'none';
                return;
            }

            paginationContainer.style.display = 'flex';

            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.className = `geo-page-btn ${i === currentPage ? 'active' : ''}`;
                btn.innerText = i;
                btn.onclick = () => {
                    renderPage(i);
                    updateActiveBtn(i);
                };
                paginationContainer.appendChild(btn);
            }

            const nextBtn = document.createElement('button');
            nextBtn.className = 'geo-page-btn';
            nextBtn.innerHTML = '<i class="fa-solid fa-chevron-right"></i>';
            nextBtn.onclick = () => {
                if (currentPage < totalPages) {
                    const nextPage = currentPage + 1;
                    renderPage(nextPage);
                    updateActiveBtn(nextPage);
                }
            };
            paginationContainer.appendChild(nextBtn);
        }

        function updateActiveBtn(activePage) {
            const buttons = document.querySelectorAll('.geo-page-btn');
            buttons.forEach((btn, idx) => {
                if (idx + 1 === activePage) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        document.addEventListener("DOMContentLoaded", function() {
            loadGeofisianaArticles();
        });
    </script>
    <script src="js/script.js"></script>
    <script src="js/seismic-cursor.js"></script>
</body>
</html>
